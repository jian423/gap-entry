<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常州仓人力缺口看板（只读在线版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6E87B0;--primary-dark:#5A7499;--light:#B2C1D6;
  --bg1:#EDE5E3;--bg2:#DBBACB;
  --gap-red:#D9534F;--gap-green:#5CB85C;--gap-gray:#999;
  --white:#fff;--text:#333;--text-light:#666;--text-muted:#999;
  --border:#e8e8e8;--shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.16);
  --radius:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);min-height:100vh;color:var(--text);font-size:14px}

/* Header */
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(110,135,176,.3)}
.header-left{display:flex;align-items:center;gap:16px}
.header-title{font-size:22px;font-weight:700;letter-spacing:1px}
.header-date{font-size:13px;opacity:.85;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px}
.header-right{display:flex;align-items:center;gap:12px}
.last-updated{font-size:12px;opacity:.7}
.btn-refresh{background:#fff;color:var(--primary);border:none;padding:8px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
.btn-refresh:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-refresh:disabled{opacity:.6;cursor:wait}
.btn-header{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);padding:8px 16px;border-radius:8px;font-size:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.btn-header:hover{background:rgba(255,255,255,.25)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--primary);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Container */
.container{max-width:1200px;margin:0 auto;padding:24px 32px}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:#fff;border-radius:var(--radius);padding:6px;box-shadow:var(--shadow)}
.tab{padding:10px 24px;border:none;background:none;font-size:14px;font-weight:500;color:var(--text-light);cursor:pointer;border-radius:8px;transition:all .2s;white-space:nowrap}
.tab:hover{background:rgba(110,135,176,.08)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(110,135,176,.3)}

/* Section title */
.section-title{font-size:18px;font-weight:700;color:var(--primary);margin:24px 0 12px;padding-left:12px;border-left:4px solid var(--primary)}

/* Summary cards */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.card{background:#fff;border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card-label{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.card-value{font-size:28px;font-weight:700;line-height:1.2}
.card-unit{font-size:13px;font-weight:400;color:var(--text-muted);margin-left:4px}
.card-icon{position:absolute;top:12px;right:14px;font-size:24px;opacity:.15}
.card.active .card-value{color:var(--primary)}
.card.hc .card-value{color:var(--primary)}
.card.leaving .card-value{color:#E8A838}
.card.trial .card-value{color:#7B68EE}
.card.gap .card-value{color:var(--gap-green)}
.card.gap.positive .card-value{color:var(--gap-red)}
.card.gap.zero .card-value{color:var(--gap-gray)}

/* Department summary inline */
.dept-summary-bar{background:#fff;border-radius:var(--radius);padding:14px 20px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.dept-summary-bar .dept-name{font-size:16px;font-weight:700;color:var(--primary)}
.dept-summary-bar .summary-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-light)}
.dept-summary-bar .summary-item strong{font-size:18px;font-weight:700;color:var(--text)}
.dept-summary-bar .summary-item.gap strong{font-size:20px}
.dept-summary-bar .summary-item.gap-negative strong{color:var(--gap-green)}
.dept-summary-bar .summary-item.gap-positive strong{color:var(--gap-red)}
.dept-summary-bar .summary-item.gap-zero strong{color:var(--gap-gray)}

/* Table */
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:24px}
.table-header{padding:16px 24px;background:linear-gradient(135deg,rgba(110,135,176,.06),rgba(178,193,214,.06));border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.table-header h3{font-size:16px;font-weight:600;color:var(--primary)}
table{width:100%;border-collapse:collapse}
th{background:rgba(110,135,176,.05);padding:12px 16px;text-align:left;font-size:13px;font-weight:600;color:var(--text-light);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--border);font-size:14px}
tr:last-child td{border-bottom:none}
tr:hover{background:rgba(110,135,176,.03)}
.gap-cell{font-weight:700;font-size:15px}
.gap-negative{color:var(--gap-green)}
.gap-positive{color:var(--gap-red)}
.gap-zero{color:var(--gap-gray)}
.remark-input{width:100%;border:1px solid transparent;background:rgba(110,135,176,.04);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--text);transition:all .2s;font-family:inherit}
.remark-input:hover{border-color:var(--border)}
.remark-input:focus{border-color:var(--primary);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(110,135,176,.1)}
.remark-saved{animation:savedFlash .8s ease}
@keyframes savedFlash{0%{background:rgba(92,184,92,.15)}100%{background:rgba(110,135,176,.04)}}
.recruit-input{width:64px;border:1px solid transparent;background:rgba(110,135,176,.04);border-radius:6px;padding:6px 8px;font-size:14px;font-weight:600;text-align:center;transition:all .2s;font-family:inherit}
.recruit-input.gap-negative{color:var(--gap-green)}
.recruit-input.gap-positive{color:var(--gap-red)}
.recruit-input.gap-zero{color:var(--gap-gray)}
.recruit-input:hover{border-color:var(--border)}
.recruit-input:focus{border-color:var(--primary);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(110,135,176,.1)}
.recruit-total{width:64px;display:inline-block;border:1px solid transparent;background:rgba(110,135,176,.04);border-radius:6px;padding:6px 8px;font-size:14px;font-weight:600;text-align:center;font-family:inherit}
.recruit-total.gap-negative{color:var(--gap-green)}
.recruit-total.gap-positive{color:var(--gap-red)}
.recruit-total.gap-zero{color:var(--gap-gray)}

/* 只读（锁定）态：查看免密，编辑需密码 */
.remark-input.locked, .recruit-input.locked{background:rgba(110,135,176,.03);color:var(--text);cursor:not-allowed}
.remark-input.locked:hover, .recruit-input.locked:hover{border-color:transparent}

/* Toast */
.toast{position:fixed;top:80px;right:32px;padding:14px 24px;border-radius:8px;font-size:14px;font-weight:500;z-index:2000;opacity:0;transform:translateX(20px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(0)}
.toast.success{background:var(--gap-green);color:#fff}
.toast.error{background:var(--gap-red);color:#fff}
.toast.info{background:var(--primary);color:#fff}

/* Loading */
.loading-overlay{display:flex;align-items:center;justify-content:center;min-height:400px;color:var(--text-muted)}
.loading-overlay .spin{width:32px;height:32px;border-width:3px}

/* Responsive */
@media(max-width:768px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .container{padding:16px}
  .header{padding:12px 16px}
  .header-title{font-size:18px}
  .dept-summary-bar{gap:12px}
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-title">常州仓人力缺口看板 <span style="display:inline-block;padding:2px 9px;border-radius:10px;background:#B2C1D6;color:#3a4a63;font-size:12px;font-weight:600;vertical-align:middle;margin-left:6px">只读在线版</span></div>
    <div class="header-date" id="headerDate">--</div>
  </div>
  <div class="header-right">
    <div class="last-updated" id="lastUpdated">--</div>
    <button class="btn-refresh" id="btnRefresh" onclick="refreshData()">
      <span id="refreshIcon">↻</span> 刷新数据
    </button>
  </div>
</div>

<div class="container">
  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('overview', event)">总体概览</button>
    <button class="tab" onclick="switchTab('质检验机', event)">质检验机</button>
    <button class="tab" onclick="switchTab('质检辅助', event)">质检辅助</button>
    <button class="tab" onclick="switchTab('仓储', event)">仓储</button>
    <div style="flex:1"></div>
  </div>

  <!-- Content -->
  <div id="content">
    <div class="loading-overlay"><div class="spin"></div></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 只读在线版（GitHub Pages 镜像，与本地实时版 localhost:3000 视觉/排版一致）
//   - 数据来自本页同源 data.json（本机看板服务每 3 分钟自动同步一次）
//   - 去除了「编辑 / 飞书授权 / 密码弹窗」——只读，所有输入框锁定
//   - 渲染逻辑与本地版完全共用，确保一模一样
// ============================================================
let state = { data: null, remarks: {}, currentTab: 'overview', editMode: false, editPassword: '' };
const DEPT_ORDER = ['质检验机', '质检辅助', '仓储'];

// ========== API ==========
// 数据同源取数：优先 data.json（与页面同网络通道，页面能开它必能取），
// 失败再退 jsDelivr / raw.githubusercontent 兜底。
const DATA_SOURCES = [
  'data.json',
  'https://fastly.jsdelivr.net/gh/jian423/gap-entry@main/data.json',
  'https://cdn.jsdelivr.net/gh/jian423/gap-entry@main/data.json',
  'https://raw.githubusercontent.com/jian423/gap-entry/main/data.json'
];
async function fetchData() {
  let lastErr = null;
  for (const base of DATA_SOURCES) {
    try {
      const url = base + (base.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      if (!d || !d.date || !d.departments) throw new Error('数据格式异常');
      return d;
    } catch (e) { lastErr = e; /* 换下一个源 */ }
  }
  throw lastErr || new Error('全部数据源不可达');
}

// ========== 初始化 ==========
async function init() {
  await loadAndRender();
}

async function loadAndRender() {
  try {
    const d = await fetchData();
    // 扁平结构 {date, departments, total, leaving_details, remarks}
    state.data = { date: d.date, departments: d.departments, total: d.total, leaving_details: d.leaving_details || [] };
    state.remarks = d.remarks || {};
    renderAll();
    document.getElementById('lastUpdated').textContent = '数据日期 ' + (d.date || '--') + '（只读在线版）';
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="loading-overlay">数据加载失败：' + (e.message || '') + '，请稍后刷新重试</div>';
  }
}

// ========== 渲染 ==========
function renderAll() {
  if (!state.data) return;
  document.getElementById('headerDate').textContent = state.data.date || '--';
  renderContent();
}

function renderCardsFromTotal(total) {
  const gapClass = total.gap < 0 ? '' : total.gap > 0 ? 'positive' : 'zero';
  return `
    <div class="cards">
      <div class="card active"><div class="card-icon">👤</div><div class="card-label">在职人数</div><div class="card-value">${total.active||0}<span class="card-unit">人</span></div></div>
      <div class="card hc"><div class="card-icon">📋</div><div class="card-label">HC编制</div><div class="card-value">${total.hc||0}<span class="card-unit">人</span></div></div>
      <div class="card leaving"><div class="card-icon">⏳</div><div class="card-label">待离职</div><div class="card-value">${total.leaving||0}<span class="card-unit">人</span></div></div>
      <div class="card trial"><div class="card-icon">🔄</div><div class="card-label">试岗</div><div class="card-value">${total.trial||0}<span class="card-unit">人</span></div></div>
      <div class="card gap ${gapClass}"><div class="card-icon">📊</div><div class="card-label">缺口</div><div class="card-value">${total.gap||0}<span class="card-unit">人</span></div></div>
    </div>`;
}

function renderDeptSummaryBar(dept, total) {
  const gapCls = total.gap < 0 ? 'gap-negative' : total.gap > 0 ? 'gap-positive' : 'gap-zero';
  return `<div class="dept-summary-bar">
    <span class="dept-name">${dept}</span>
    <span class="summary-item">在职 <strong>${total.active}</strong></span>
    <span class="summary-item">HC <strong>${total.hc}</strong></span>
    <span class="summary-item">待离职 <strong>${total.leaving}</strong></span>
    <span class="summary-item">试岗 <strong>${total.trial}</strong></span>
    <span class="summary-item gap ${gapCls}">缺口 <strong>${total.gap}</strong></span>
  </div>`;
}

function renderC5Table(groups, t, deptLabel) {
  const gapCls = t.gap < 0 ? 'gap-negative' : t.gap > 0 ? 'gap-positive' : 'gap-zero';

  // 只读版：输入框永远锁定（无编辑模式）
  const lockAttr = 'readonly';
  const lockCls = ' locked';
  const rows = groups.map(g => {
    const cls = g.gap < 0 ? 'gap-negative' : g.gap > 0 ? 'gap-positive' : 'gap-zero';
    const remark = state.remarks[g.name] || '';
    const recruit = (g.recruit !== undefined && g.recruit !== null) ? g.recruit : g.gap;
    const recruitCls = recruit < 0 ? 'gap-negative' : recruit > 0 ? 'gap-positive' : 'gap-zero';
    return `<tr>
      <td>${g.name}</td>
      <td>${g.active}</td>
      <td>${g.hc}</td>
      <td>${g.leaving}</td>
      <td>${g.trial}</td>
      <td class="gap-cell ${cls}">${g.gap}</td>
      <td><input type="text" class="recruit-input ${recruitCls}${lockCls}" data-key="${g.name}" value="${recruit}" title="待招人数（默认=缺口）" ${lockAttr}></td>
      <td><input type="text" class="remark-input${lockCls}" data-key="${g.name}" value="${escapeHtml(remark)}" placeholder="（只读）" ${lockAttr}></td>
    </tr>`;
  }).join('');

  const totalRecruit = (t.recruit !== undefined && t.recruit !== null) ? t.recruit : t.gap;
  const totalRecruitCls = totalRecruit < 0 ? 'gap-negative' : totalRecruit > 0 ? 'gap-positive' : 'gap-zero';
  return `<div class="table-wrap">
    <table>
      <thead><tr>
        <th>C5组别${deptLabel ? ' ('+deptLabel+')' : ''}</th><th>在职</th><th>HC</th><th>待离职</th><th>试岗</th><th>缺口</th><th>待招人数</th><th style="min-width:220px">备注</th>
      </tr></thead>
      <tbody>${rows}
        <tr style="background:rgba(110,135,176,.06);font-weight:600">
          <td>合计</td><td>${t.active}</td><td>${t.hc}</td><td>${t.leaving}</td><td>${t.trial}</td>
          <td class="gap-cell ${gapCls}">${t.gap}</td>
          <td><span class="recruit-total ${totalRecruitCls}">${totalRecruit}</span></td><td></td>
        </tr>
      </tbody>
    </table>
  </div>`;
}

// 待离职明细表：工号 / 姓名 / C4 / C5 / 离职时间 / 备注
function renderLeavingTable(rows, title, scopeLabel) {
  const list = (rows || []).slice().sort((a, b) => String(a.leave_date || '').localeCompare(String(b.leave_date || '')));
  const todayStr = new Date().toISOString().slice(0, 10);
  const lockAttr = 'readonly';
  const lockCls = ' locked';

  const body = list.length ? list.map(r => {
    const urgent = r.leave_date && r.leave_date <= addDays(todayStr, 3);
    const rkey = 'leave_remark:' + (r.emp_id || ((r.name || '') + '@' + (r.leave_date || '')));
    const saved = state.remarks[rkey];
    // 本地已保存的备注优先；没有则回落到飞书花名册里的「离职备注」
    const rval = (saved === undefined || saved === null) ? (r.remark || '') : saved;
    return `<tr>
      <td>${escapeHtml(r.emp_id || '')}</td>
      <td>${escapeHtml(r.name || '')}</td>
      <td>${escapeHtml(r.c4 || '')}</td>
      <td>${escapeHtml(r.c5 || '')}</td>
      <td style="white-space:nowrap;${urgent ? 'color:var(--gap-red);font-weight:600' : ''}">${escapeHtml(r.leave_date || '')}${urgent ? ' <span style="font-size:11px;background:#fdecea;color:#D9534F;padding:1px 6px;border-radius:8px">3天内</span>' : ''}</td>
      <td><input type="text" class="remark-input${lockCls}" data-key="${escapeHtml(rkey)}" value="${escapeHtml(rval)}" placeholder="（只读）" ${lockAttr}></td>
    </tr>`;
  }).join('') : `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:28px">${scopeLabel ? scopeLabel + ' 当前无待离职人员' : '当前无待离职人员'}</td></tr>`;

  return `<div class="section-title">${title}
      <span style="font-size:13px;font-weight:400;color:var(--text-muted);margin-left:6px">共 ${list.length} 人 · 按离职时间排序</span>
    </div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>工号</th><th>姓名</th><th>C4</th><th>C5</th><th>离职时间</th><th style="min-width:220px">备注</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
  </div>`;
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

function renderContent() {
  const container = document.getElementById('content');
  const allLeaving = (state.data && state.data.leaving_details) || [];

  if (state.currentTab === 'overview') {
    let html = renderCardsFromTotal(state.data.total);
    html += '<div class="section-title">各部门 C5 明细（跨部门同名 C5 已合并）</div>';

    for (const dept of DEPT_ORDER) {
      const d = state.data.departments[dept];
      if (!d) continue;
      html += renderDeptSummaryBar(dept, d.total);
      html += renderC5Table(d.c5_groups, d.total, dept);
    }

    // 待离职明细：总体概览显示全部部门
    html += renderLeavingTable(allLeaving, '待离职明细');

    container.innerHTML = html;
  } else {
    const d = state.data.departments[state.currentTab];
    if (!d) { container.innerHTML = '<div class="loading-overlay">无数据</div>'; return; }

    let html = renderCardsFromTotal(d.total);
    html += '<div class="section-title">' + state.currentTab + ' C5组别明细</div>';
    html += renderC5Table(d.c5_groups, d.total, state.currentTab);

    // 待离职明细：只显示当前 C4 部门的人（与 Tab 联动）
    const deptLeaving = allLeaving.filter(r => r.c4 === state.currentTab);
    html += renderLeavingTable(deptLeaving, state.currentTab + ' 待离职明细', state.currentTab);

    container.innerHTML = html;
  }

  // 只读版：强制所有输入框锁定（无编辑态切换）
  setEditModeUI(false);
}

// ========== 编辑态（只读版恒为 false）==========
function setEditModeUI(on) {
  document.querySelectorAll('.remark-input, .recruit-input').forEach(el => {
    el.readOnly = !on;
    el.classList.toggle('locked', !on);
  });
}

// ========== 交互 ==========
function switchTab(tab, evt) {
  state.currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (evt) evt.currentTarget.classList.add('active');
  renderContent();
}

async function refreshData() {
  const btn = document.getElementById('btnRefresh');
  const icon = document.getElementById('refreshIcon');
  btn.disabled = true;
  icon.innerHTML = '<span class="spin"></span>';
  const restored = '↻';
  btn.prepend(icon);
  try {
    await loadAndRender();
    showToast('数据已刷新', 'success');
  } catch (e) {
    showToast('刷新失败: ' + (e.message || '未知错误'), 'error');
  } finally {
    btn.disabled = false;
    icon.innerHTML = restored;
    btn.prepend(icon);
  }
}

function escapeHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========== Toast ==========
function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ========== 启动 ==========
init();
</script>
</body>
</html>
