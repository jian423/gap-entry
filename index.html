<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>常州仓人力缺口看板</title>
<style>
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#6d28d9,#a21caf);color:#fff;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box{padding:28px 36px;border-radius:16px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);max-width:560px;width:100%}
  h1{font-size:22px;margin:0 0 10px}
  #msg{font-size:15px;opacity:.95;line-height:1.7;margin-bottom:18px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  .small{font-size:12px;opacity:.75;margin-top:18px;line-height:1.7}
  .small a{color:#fde68a}
</style>
</head>
<body>
  <div class="box">
    <h1>常州仓人力缺口看板</h1>
    <div id="msg"><span class="spin"></span>正在打开看板…</div>
  </div>
<script>
  // ============================================================
  // 入口页（2026-09-08 终态）：
  //   默认行为 → 直接跳【共享快照版】（所有设备都能开，永久稳定）
  //   ?me=1   → 跳【实时版】（仅本机 server.js 在跑时可用）
  //   实时版与快照版都已是稳定链接（一个对内、一个对外）
  // ============================================================
  var LOCAL_URL = 'http://localhost:3000';

  // 共享快照版（CloudStudio）跳转逻辑
  var SOURCES = [
    './gap_url.json',
    'https://raw.githubusercontent.com/jian423/gap-entry/main/gap_url.json'
  ];
  function goStatic(){
    var i = 0;
    function next(){
      if (i >= SOURCES.length) {
        document.getElementById('msg').innerHTML = '⚠️ 共享看板暂不可达，请稍后重试';
        return;
      }
      fetch(SOURCES[i] + '?t=' + Date.now(), {cache:'no-store'})
        .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
        .then(function(d){
          if (d && d.url) window.location.replace(d.url);
          else next();
        })
        .catch(function(){ i++; next(); });
    }
    next();
  }

  var isMe = /[?&]me=1/.test(location.search);

  if (isMe) {
    document.getElementById('msg').innerHTML = '<span class="spin"></span>正在打开本机实时版…';
    window.location.replace(LOCAL_URL);
  } else {
    goStatic();
  }
</script>
</body>
</html>
